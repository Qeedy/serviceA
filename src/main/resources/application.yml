server:
  port: 8081
spring:
  application:
    name: serviceA
#  datasource:
#    url: jdbc:postgresql://localhost:5432/postgres
#    username: postgres
#    password: admin
#    driver-class-name: org.postgresql.Driver
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000u
        loggerLevel: full

logging:
  level:
    org.springframework.security: DEBUG
